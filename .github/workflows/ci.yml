name: CI

on:
  push:
  pull_request:

# Least-privilege default — this workflow only reads the repo, it never
# needs to write. Flagged in the M0 team review (Putter-Team-Reviews.md,
# Review 1, DevSecOps finding) since the default GITHUB_TOKEN scope without
# this block is broader than the job actually needs.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
